<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 32" width="220" height="32">
  <rect x="1" y="1" width="218" height="30" fill="none" stroke="#00FF41" stroke-width="2">
    <animate attributeName="stroke-opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="4" y="4" width="8" height="24" fill="#00FF41">
    <animate attributeName="opacity" values="1;0.2;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="20" y="21" font-family="Fira Code,Consolas,monospace" font-size="13" font-weight="700" fill="#00FF41" letter-spacing="1">AI / ML</text>
</svg>
